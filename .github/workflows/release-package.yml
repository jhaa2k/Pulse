name: Android release packaging

on:
  push:
    branches: [main, "engine/**", "fix/**"]
    paths:
      - "app/**"
      - "tools/studio-fonts.txt"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/release-package.yml"
  workflow_dispatch:
    inputs:
      signed:
        description: "Use configured production signing secrets (does not publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare wrapper
        run: chmod +x gradlew
      - name: Determine signing mode
        id: signing
        env:
          KEYSTORE_PRESENT: ${{ secrets.VEXO_RELEASE_KEYSTORE_BASE64 != '' }}
          STORE_PASSWORD_PRESENT: ${{ secrets.VEXO_RELEASE_STORE_PASSWORD != '' }}
          ALIAS_PRESENT: ${{ secrets.VEXO_RELEASE_KEY_ALIAS != '' }}
          KEY_PASSWORD_PRESENT: ${{ secrets.VEXO_RELEASE_KEY_PASSWORD != '' }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REQUEST_SIGNED: ${{ inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] && [ "$REQUEST_SIGNED" != true ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$KEYSTORE_PRESENT" = true ] && [ "$STORE_PASSWORD_PRESENT" = true ] && [ "$ALIAS_PRESENT" = true ] && [ "$KEY_PASSWORD_PRESENT" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = main ] || [ "$EVENT" = workflow_dispatch ] || [ "$KEYSTORE_PRESENT" = true ] || [ "$STORE_PASSWORD_PRESENT" = true ] || [ "$ALIAS_PRESENT" = true ] || [ "$KEY_PASSWORD_PRESENT" = true ]; then
            echo "::error::Production signing requires all four VEXO_RELEASE secrets. No substitute key will be generated."
            exit 1
          else
            echo "::warning::No production signing secrets configured. Building unsigned validation packages only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build unsigned release candidate
        if: steps.signing.outputs.signed == 'false'
        run: bash .github/scripts/gradle-ci.sh testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Build signed release candidate
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VEXO_RELEASE_KEYSTORE_BASE64 }}
          VEXO_RELEASE_STORE_PASSWORD: ${{ secrets.VEXO_RELEASE_STORE_PASSWORD }}
          VEXO_RELEASE_KEY_ALIAS: ${{ secrets.VEXO_RELEASE_KEY_ALIAS }}
          VEXO_RELEASE_KEY_PASSWORD: ${{ secrets.VEXO_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${VEXO_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${VEXO_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${VEXO_RELEASE_KEY_PASSWORD:?Missing key password}"
          umask 077
          export VEXO_RELEASE_KEYSTORE="$(mktemp "$RUNNER_TEMP/vexo-release.XXXXXX")"
          trap 'rm -f "$VEXO_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$VEXO_RELEASE_KEYSTORE"
          unset KEYSTORE_BASE64
          bash .github/scripts/gradle-ci.sh testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Collect packages and verify signatures
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          if [ "$SIGNED" = "true" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            label=signed
          else
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
            label=unsigned
          fi
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          if [ "$label" = signed ]; then
            sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)"
            test -n "$apksigner"
            "$apksigner" verify --verbose --print-certs "$apk"
            jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$aab" > "$RUNNER_TEMP/aab-signature.txt"
            cat "$RUNNER_TEMP/aab-signature.txt"
            grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
          fi
          cp "$apk" "release-output/vexo-3.0.0-$label.apk"
          cp "$aab" "release-output/vexo-3.0.0-$label.aab"
          (cd release-output && sha256sum *.apk *.aab > SHA256SUMS.txt)
          printf 'Commit: %s\nSigning: %s\nNot published. Device validation remains a separate gate.\n' "$GITHUB_SHA" "$label" > release-output/BUILD_INFO.txt
      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: vexo-release-candidate-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: release-output/
          if-no-files-found: error
      - name: Upload release validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexo-release-validation
          path: |
            app/build/reports/lint-results-release.*
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
