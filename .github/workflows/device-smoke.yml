name: Android device smoke tests

on:
  push:
    branches: ["engine/**", "fix/**"]
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/device-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Prepare Android test APKs
        run: |
          chmod +x gradlew
          bash .github/scripts/gradle-ci.sh assembleDebug assembleDebugAndroidTest
      - name: Execute instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Collect emulator logs
        if: always()
        run: adb logcat -d > emulator-logcat.txt || true
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexo-device-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-logcat.txt
          if-no-files-found: ignore
