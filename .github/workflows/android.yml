name: Android CI

on:
  push:
    branches: [main, "engine/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Print complete lint report on validation failure
        if: failure()
        shell: bash
        run: |
          report="app/build/reports/lint-results-debug.txt"
          if [ -f "$report" ]; then
            cat "$report"
          else
            find app/build/intermediates/lint_intermediate_text_report -name lint-results-debug.txt -exec cat {} \; 2>/dev/null || true
          fi
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexo-validation-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vexo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
