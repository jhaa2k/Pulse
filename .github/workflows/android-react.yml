name: VOOC React Android APK

on:
  push:
    branches: ["android/vooc-react"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Compile original React and TypeScript app
        run: npm run build
      - name: Create Android project and bundle web assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK and prepare download
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/VOOC-Android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify output/VOOC-Android-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOOC-React-Android-APK
          path: output/VOOC-Android-debug.apk
          if-no-files-found: error
