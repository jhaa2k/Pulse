name: Generate Key
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Create Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias vexo-key -storepass vexo1234 -keypass vexo1234 -dname "CN=Vexo, OU=App, O=Dev, L=City, S=State, C=IN"
          base64 -w 0 release.jks > key_base64.txt
      - name: Download Key
        uses: actions/upload-artifact@v4
        with:
          name: vexo-signing-key
          path: |
            release.jks
            key_base64.txt
