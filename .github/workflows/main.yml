name: Signing configuration check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret presence without revealing values
        env:
          KEYSTORE_PRESENT: ${{ secrets.VEXO_RELEASE_KEYSTORE_BASE64 != '' }}
          STORE_PASSWORD_PRESENT: ${{ secrets.VEXO_RELEASE_STORE_PASSWORD != '' }}
          ALIAS_PRESENT: ${{ secrets.VEXO_RELEASE_KEY_ALIAS != '' }}
          KEY_PASSWORD_PRESENT: ${{ secrets.VEXO_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "$KEYSTORE_PRESENT" != true ]; then echo "::error::Missing VEXO_RELEASE_KEYSTORE_BASE64"; missing=1; fi
          if [ "$STORE_PASSWORD_PRESENT" != true ]; then echo "::error::Missing VEXO_RELEASE_STORE_PASSWORD"; missing=1; fi
          if [ "$ALIAS_PRESENT" != true ]; then echo "::error::Missing VEXO_RELEASE_KEY_ALIAS"; missing=1; fi
          if [ "$KEY_PASSWORD_PRESENT" != true ]; then echo "::error::Missing VEXO_RELEASE_KEY_PASSWORD"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All signing secrets are present. Run Android release packaging on main with signed enabled."
